openapi: 3.1.0
info:
  title: Smash Local HTTP API
  version: "1"
  summary: Loopback-only local API for Smash
  description: |
    Smash exposes a local-only HTTP API for agent memory, graph, ingest,
    validation, and maintenance workflows.

    Security model:
    - Binds to `127.0.0.1`
    - Rejects non-local `Host` headers
    - Has no authentication
    - Mutation requests require `X-Smash-Local-Action: true`
  license:
    name: Local-only API
servers:
  - url: http://127.0.0.1:3001
    description: Dedicated `api.py` runner
  - url: http://127.0.0.1:3000
    description: Shared API surface while `serve.py` is running
tags:
  - name: discovery
  - name: status
  - name: ingest
  - name: pages
  - name: graph
  - name: memory
  - name: proposals
  - name: maintenance
components:
  securitySchemes:
    localActionHeader:
      type: apiKey
      in: header
      name: X-Smash-Local-Action
      description: Required for local mutation endpoints. Use `true`.
  parameters:
    project:
      name: project
      in: query
      schema:
        type: string
      description: Optional project slug filter.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
      description: Optional result limit.
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
      description: Optional pagination offset.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
      additionalProperties: true
    GenericObject:
      type: object
      additionalProperties: true
    MutationAck:
      type: object
      additionalProperties: true
    RawSourceCreateRequest:
      type: object
      properties:
        text:
          type: string
        title:
          type: string
      required: [text]
      additionalProperties: true
    ProposeMemoriesRequest:
      type: object
      properties:
        text:
          type: string
        source:
          type: string
        project:
          type: string
        limit:
          type: integer
      required: [text]
      additionalProperties: true
    RememberMemoryRequest:
      type: object
      properties:
        text:
          type: string
        title:
          type: string
        memory_type:
          type: string
        scope:
          type: string
        project:
          type: string
        source:
          type: string
        visibility:
          type: string
        review_after:
          type: string
        expires_at:
          type: string
      required: [text]
      additionalProperties: true
    UpdateMemoryRequest:
      type: object
      properties:
        identifier:
          type: string
        text:
          type: string
        source:
          type: string
        project:
          type: string
      required: [identifier, text]
      additionalProperties: true
    MemoryActionRequest:
      type: object
      properties:
        memory:
          type: string
        identifier:
          type: string
        note:
          type: string
        reason:
          type: string
      additionalProperties: true
  responses:
    JsonOk:
      description: JSON response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericObject"
    JsonError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api:
    get:
      tags: [discovery]
      summary: API discovery payload
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/status:
    get:
      tags: [status]
      summary: Read workspace status
      parameters:
        - name: validate
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/health:
    get:
      tags: [status]
      summary: Read readiness, validation, and operations state
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/operations:
    get:
      tags: [maintenance]
      summary: Read interrupted and active operations
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/prompts:
    get:
      tags: [status]
      summary: Read starter prompt payloads
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/ingest-status:
    get:
      tags: [ingest]
      summary: Read ingest and source status
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/pages:
    get:
      tags: [pages]
      summary: Read the full page catalog
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/page-list:
    get:
      tags: [pages]
      summary: Read a paginated page catalog
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: category
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page_type
          in: query
          schema:
            type: string
        - name: maturity
          in: query
          schema:
            type: string
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
  /api/backlinks:
    get:
      tags: [pages]
      summary: Read the backlinks index
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "500":
          $ref: "#/components/responses/JsonError"
  /api/page-links:
    get:
      tags: [pages]
      summary: Read paginated inbound and forward links for a page
      parameters:
        - name: page
          in: query
          schema:
            type: string
        - name: page_name
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/validate:
    get:
      tags: [maintenance]
      summary: Run validation
      parameters:
        - name: strict
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Validation passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/graph:
    get:
      tags: [graph]
      summary: Read full graph data
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/graph-summary:
    get:
      tags: [graph]
      summary: Read bounded graph summary
      parameters:
        - name: topic
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 3
        - name: max_edges
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
  /api/search:
    get:
      tags: [graph]
      summary: Search pages
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
  /api/context:
    get:
      tags: [graph]
      summary: Read context for a topic
      parameters:
        - name: topic
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
  /api/memory-profile:
    get:
      tags: [memory]
      summary: Read memory profile
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/memory-dashboard:
    get:
      tags: [memory]
      summary: Read memory dashboard
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/memory-brief:
    get:
      tags: [memory]
      summary: Read bounded relevant memory packet
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/query-Smash:
    get:
      tags: [memory]
      summary: Read answer-ready context packet
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - name: budget
          in: query
          schema:
            type: string
            enum: [micro, small, medium, large]
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
  /api/memory-audit:
    get:
      tags: [memory]
      summary: Read memory audit
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/memory-inbox:
    get:
      tags: [memory]
      summary: Read memory inbox
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/wins:
    get:
      tags: [memory]
      summary: Read memory wins
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/memory-log:
    get:
      tags: [memory]
      summary: Read memory log
      parameters:
        - $ref: "#/components/parameters/limit"
        - name: include_captures
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/capture-inbox:
    get:
      tags: [memory]
      summary: Read capture inbox
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/explain-memory:
    get:
      tags: [memory]
      summary: Read explanation and graph context for a memory
      parameters:
        - name: memory
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/proposal-sources:
    get:
      tags: [proposals]
      summary: List proposal-ready raw sources
      parameters:
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/proposal-source:
    get:
      tags: [proposals]
      summary: Read one proposal source file
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/raw-source:
    post:
      tags: [ingest]
      summary: Create a raw source
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawSourceCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "201":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/propose-memories:
    post:
      tags: [proposals]
      summary: Propose memory candidates from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeMemoriesRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/remember-memory:
    post:
      tags: [memory]
      summary: Create a memory
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RememberMemoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "409":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/update-memory:
    post:
      tags: [memory]
      summary: Update an existing memory
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "409":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/review-memory:
    post:
      tags: [memory]
      summary: Mark a memory reviewed
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/archive-memory:
    post:
      tags: [memory]
      summary: Archive a memory
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/restore-memory:
    post:
      tags: [memory]
      summary: Restore an archived memory
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/rebuild-backlinks:
    post:
      tags: [maintenance]
      summary: Rebuild backlinks
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "403":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
  /api/rebuild-index:
    post:
      tags: [maintenance]
      summary: Rebuild search and page index
      security:
        - localActionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
        "403":
          $ref: "#/components/responses/JsonError"
        "415":
          $ref: "#/components/responses/JsonError"
