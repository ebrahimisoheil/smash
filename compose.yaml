name: engrave-v2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${ENGRAVE_POSTGRES_PORT}:5432"
    volumes:
      - engrave_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations/20260802120000_initial_schema.sql:/migrations/001_initial_schema.sql:ro
      - ./migrations/20260803100000_phase_c_pipeline.sql:/migrations/002_phase_c_pipeline.sql:ro
      - ./migrations/20260804100000_phase_d_memory_review.sql:/migrations/003_phase_d_memory_review.sql:ro
      - ./migrations/20260805100000_phase_e_retrieval.sql:/migrations/004_phase_e_retrieval.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql --host=postgres --username=${POSTGRES_USER}
        --dbname=${POSTGRES_DB} --file=/migrations/001_initial_schema.sql
        && psql --host=postgres --username=${POSTGRES_USER}
        --dbname=${POSTGRES_DB} --file=/migrations/002_phase_c_pipeline.sql
        && psql --host=postgres --username=${POSTGRES_USER}
        --dbname=${POSTGRES_DB} --file=/migrations/003_phase_d_memory_review.sql
        && psql --host=postgres --username=${POSTGRES_USER}
        --dbname=${POSTGRES_DB} --file=/migrations/004_phase_e_retrieval.sql

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ENGRAVE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ENGRAVE_MINIO_ROOT_PASSWORD}
    ports:
      - "${ENGRAVE_MINIO_PORT}:9000"
      - "${ENGRAVE_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - engrave_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  init-minio:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 ${ENGRAVE_MINIO_ROOT_USER} ${ENGRAVE_MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/${ENGRAVE_MINIO_BUCKET}"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/api"]
    environment:
      ENGRAVE_ENVIRONMENT: ${ENGRAVE_ENVIRONMENT}
      ENGRAVE_DATABASE_URL: ${ENGRAVE_DATABASE_URL}
      ENGRAVE_MINIO_ENDPOINT: ${ENGRAVE_MINIO_ENDPOINT}
      ENGRAVE_MINIO_BUCKET: ${ENGRAVE_MINIO_BUCKET}
    ports:
      - "${ENGRAVE_API_PORT}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/worker"]
    environment:
      ENGRAVE_ENVIRONMENT: ${ENGRAVE_ENVIRONMENT}
      ENGRAVE_DATABASE_URL: ${ENGRAVE_DATABASE_URL}
      ENGRAVE_MINIO_ENDPOINT: ${ENGRAVE_MINIO_ENDPOINT}
      ENGRAVE_MINIO_BUCKET: ${ENGRAVE_MINIO_BUCKET}
      ENGRAVE_TENANT_ID: ${ENGRAVE_TENANT_ID}
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
    ports:
      - "${ENGRAVE_WEB_PORT}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  engrave_postgres:
  engrave_minio:
