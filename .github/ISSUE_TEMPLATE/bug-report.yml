name: Bug report
description: Something in Smash behaved wrong or broke.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get instead?
      placeholder: |
        I ran `smash ...` and expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: smash doctor output
      description: |
        Paste the output of `smash doctor <your-workspace>` and `smash --version`.
        It contains no memory content — only workspace structure and health.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: How did you install Smash?
      options:
        - Homebrew (brew install ebrahimisoheil/smash/Smash)
        - pip (smash-mcp)
        - Source checkout
        - Other / not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and agent
      placeholder: "macOS 15 · Claude Code (or Codex, Cursor, ...)"
    validations:
      required: true
