name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build-and-test:
    name: Build, format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  dependency-policy:
    name: Dependency policy and security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Check advisories, licenses, sources, and bans
        run: cargo deny check

      - name: Check RustSec advisories
        # RUSTSEC-2023-0071 is present only through sqlx-mysql's optional
        # dependency metadata. This workspace enables sqlx-postgres only;
        # `cargo tree` confirms rsa is not in the activated graph.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0002

  check-core-boundary:
    name: Check framework-free core and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Reject forbidden dependencies below the adapter layer
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|[[:space:]])(axum|tower|tower-http|sqlx|tokio|reqwest|lancedb) v'

          for package in smash-core smash-contracts; do
            echo "Dependency tree for ${package}:"
            cargo tree --package "${package}" --locked

            if cargo tree --package "${package}" --locked | grep -E "${forbidden}"; then
              echo "${package} contains a forbidden framework or adapter dependency"
              exit 1
            fi
          done

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - name: Explain Phase A placeholder
        run: |
          echo "Phase A has no API routes or generated OpenAPI artifact yet."
          echo "This job becomes a generation-and-diff check when the first route lands."
