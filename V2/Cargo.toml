[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/core",
    "crates/storage",
    "crates/api",
    "crates/worker",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
