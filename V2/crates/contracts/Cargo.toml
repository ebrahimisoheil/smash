[package]
name = "engrave-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared types, IDs, event and error models — the single origin for generated schemas and the published OpenAPI description."

[dependencies]
garde = { version = "0.23.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "1.0.145"
