[package]
name = "engrave-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tokio job loop over engrave-core and engrave-storage. Must never depend on Axum."

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
engrave-contracts = { path = "../contracts" }
engrave-core = { path = "../core" }
engrave-storage = { path = "../storage" }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
uuid = { version = "1.24.0", features = ["v7"] }
time = "0.3.55"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json"] }
