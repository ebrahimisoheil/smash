[package]
name = "engrave-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP adapter over engrave-core, sharing the API's authorization path. Must never depend on Axum."

[[bin]]
name = "mcp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
engrave-contracts = { path = "../contracts" }
engrave-core = { path = "../core" }
engrave-storage = { path = "../storage" }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
time = "0.3.55"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json"] }
