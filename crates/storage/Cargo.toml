[package]
name = "engrave-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLx, MinIO (S3), and LanceDB adapters implementing core's ports."

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["rt-tokio", "http-1x", "sigv4a", "default-https-client"] }
lancedb = "0.29.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
engrave-contracts = { path = "../contracts" }
engrave-core = { path = "../core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "json"] }
uuid = { version = "1.24.0", features = ["v7"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.48.0", features = ["time"] }
time = "0.3.55"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
time = "0.3.55"
