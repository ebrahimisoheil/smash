[package]
name = "engrave-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Framework-free domain and application services: Memory lifecycle, Rules, retrieval router, authorization decisions."

[dependencies]
async-trait = "0.1.91"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
engrave-contracts = { path = "../contracts" }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.8"
