[package]
name = "engrave-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Axum router, Tower layers, Serde models, Utoipa annotations, error mapping. The canonical HTTP surface."

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
engrave-contracts = { path = "../contracts" }
engrave-core = { path = "../core" }
engrave-storage = { path = "../storage" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
time = "0.3.55"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "compression-full", "cors", "request-id"] }
utoipa = "5.5.0"
uuid = { version = "1.24.0", features = ["v7"] }
