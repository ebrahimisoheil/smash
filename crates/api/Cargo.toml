[package]
name = "smash-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Axum router, Tower layers, Serde models, Utoipa annotations, error mapping. The canonical HTTP surface."

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
smash-core = { path = "../core" }
smash-storage = { path = "../storage" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "compression-full", "cors", "request-id"] }
utoipa = "5.5.0"
